name: Collect Danish news snippets

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency: news

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - name: Commit news.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news snippets"
          git push
