<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dansk</title>
<meta name="description" content="Learn Danish in short daily sessions.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dansk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>

<nav id="tabbar" hidden>
  <button data-a="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
  <button data-a="tab" data-tab="vocab"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h9M4 18h6"/><path d="M18 13v7M14.5 16.5h7"/></svg><span>Vocabulary</span></button>
  <button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-7"/></svg><span>Progress</span></button>
  <button data-a="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg><span>Settings</span></button>
</nav>

<section id="overlay" hidden></section>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input id="file" type="file" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
